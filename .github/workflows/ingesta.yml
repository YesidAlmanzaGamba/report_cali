name: Ingesta de datos

# Cada 15 minutos. Solo hace commit si el contenido cambió de verdad: el hash que
# calcula `writeDataset` ignora `ingested_at`, así que una corrida sin novedades no
# ensucia el historial. Ese historial ES la trazabilidad de procedencia (ADR-004).
on:
  schedule:
    # Cada 30 minutos. El ShakeMap del USGS se revisa pocas veces al día y los boletines
    # oficiales salen cada varias horas, así que consultar más seguido no trae datos más
    # frescos: solo golpea servicios públicos que ahora mismo están bajo carga.
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Evita que dos corridas se pisen y produzcan un conflicto al hacer push.
concurrency:
  group: ingesta
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingesta:
    runs-on: ubuntu-latest
    # Un feed que acepta la conexión y no responde nunca puede colgar la corrida hasta el
    # límite por defecto de GitHub, que son SEIS HORAS. Con el cron cada 30 minutos y el
    # grupo de concurrencia serializando, una sola corrida colgada bloquea la ingesta el
    # resto del día. `fetchWithRetry` ya pone tiempo límite por petición; esto es la red
    # de seguridad del trabajo entero.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Astro exige ≥22.12 y con 22.11 el build falla sin decir por qué (ver
          # «Trampas conocidas» en CLAUDE.md). Se fija el mínimo en vez de un `22` suelto.
          node-version: '22.12'
          cache: npm

      - run: npm ci

      - name: Consultar fuentes
        id: ingesta
        run: npm run ingest

      # Sube los datos al origen que sirve al sitio. Va ANTES del commit a propósito:
      # lo que le importa a quien está consultando el mapa es tener el dato fresco; el
      # commit es el archivo histórico y puede esperar unos segundos.
      # Sin credenciales configuradas, el script no hace nada y sale en cero.
      # `continue-on-error` a propósito: archivar los datos en git es la garantía
      # principal del proyecto, y una subida a R2 —que es una optimización— nunca puede
      # impedirla. Si R2 falla, el mapa sigue sirviendo datos desde su propio dominio.
      - name: Subir a R2
        if: '!cancelled()'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/upload-r2.sh

      # `if: !cancelled()` — se publica AUNQUE la ingesta haya fallado, y no es descuido.
      #
      # `runner.ts` aísla cada paso: si uno falla, los demás ya escribieron su dato bueno
      # en disco. Sin esta línea, un paso caído se llevaba por delante la publicación de
      # todos los demás — y el paso más fácil de tumbar es el que lee los archivos
      # curados, que los edita gente a mano. Una coma de más en curated/ayuda.json
      # congelaba el mapa entero, USGS incluido, hasta que alguien lo notara.
      #
      # Publicar lo que sí salió bien es siempre mejor que servir datos de hace horas.
      # El trabajo igual queda marcado como fallido, así que el error no pasa inadvertido.
      - name: Publicar si hubo cambios
        if: '!cancelled()'
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "Sin cambios en los datos."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "datos: actualización automática $(date -u '+%Y-%m-%d %H:%M UTC')"

          # Otra corrida pudo haber hecho push mientras esta trabajaba, y también puede
          # hacerlo entre el `pull` y el `push` de abajo — la ventana es pequeña pero el
          # cron corre cada 30 minutos durante una emergencia, y perder una corrida de
          # datos por una carrera es justo lo que no queremos. Tres intentos.
          for intento in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Publicado en el intento ${intento}."
              exit 0
            fi
            echo "Push rechazado (intento ${intento}); el origen se movió. Reintentando…"
            sleep $((intento * 5))
          done

          echo "No se pudo publicar tras 3 intentos." >&2
          exit 1

      # Deja el resultado a la vista en la pestaña del trabajo. Sin esto hay que abrir el
      # log y leerlo entero para saber qué fuente se cayó, y las fuentes se caen a
      # menudo: son servidores públicos bajo carga.
      - name: Resumen
        if: '!cancelled()'
        run: |
          {
            echo "### Ingesta"
            echo
            if [ "${{ steps.ingesta.outcome }}" = "success" ]; then
              echo "Consulta de fuentes: correcta."
            else
              echo "Consulta de fuentes: **con fallos** — revisa el paso «Consultar fuentes»."
            fi
            echo
            if [ -f data/fuentes/candidatos.json ]; then
              node -e '
                const j = require("./data/fuentes/candidatos.json");
                const c = j.candidatos ?? [];
                const conMun = c.filter((x) => x.pcode).length;
                console.log(`- Notas: **${c.length}** · con municipio: **${conMun}** (${Math.round((conMun / c.length) * 100)} %)`);
                console.log(`- Feeds regionales: ${j.feeds_regionales ?? 0}` + ((j.feeds_caidos ?? []).length ? ` · **caídos: ${j.feeds_caidos.join(", ")}**` : " · todos respondieron"));
              '
            fi
          } >> "$GITHUB_STEP_SUMMARY"
