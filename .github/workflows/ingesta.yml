name: Ingesta de datos

# Cada 15 minutos. Solo hace commit si el contenido cambió de verdad: el hash que
# calcula `writeDataset` ignora `ingested_at`, así que una corrida sin novedades no
# ensucia el historial. Ese historial ES la trazabilidad de procedencia (ADR-004).
on:
  schedule:
    # Cada 30 minutos. El ShakeMap del USGS se revisa pocas veces al día y los boletines
    # oficiales salen cada varias horas, así que consultar más seguido no trae datos más
    # frescos: solo golpea servicios públicos que ahora mismo están bajo carga.
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Evita que dos corridas se pisen y produzcan un conflicto al hacer push.
concurrency:
  group: ingesta
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingesta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Consultar fuentes
        run: npm run ingest

      # Sube los datos al origen que sirve al sitio. Va ANTES del commit a propósito:
      # lo que le importa a quien está consultando el mapa es tener el dato fresco; el
      # commit es el archivo histórico y puede esperar unos segundos.
      # Sin credenciales configuradas, el script no hace nada y sale en cero.
      # `continue-on-error` a propósito: archivar los datos en git es la garantía
      # principal del proyecto, y una subida a R2 —que es una optimización— nunca puede
      # impedirla. Si R2 falla, el mapa sigue sirviendo datos desde su propio dominio.
      - name: Subir a R2
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/upload-r2.sh

      - name: Publicar si hubo cambios
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "Sin cambios en los datos."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "datos: actualización automática $(date -u '+%Y-%m-%d %H:%M UTC')"

          # Otra corrida pudo haber hecho push mientras esta trabajaba.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
