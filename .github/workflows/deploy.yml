name: Desplegar

# Publica el sitio en Cloudflare Pages cuando cambia el código o los datos.
# El cron de ingesta hace commit en `data/`, así que cada actualización de datos
# dispara un despliegue nuevo sin intervención.
#
# ── Configuración necesaria una sola vez ────────────────────────────────────
# En Settings → Secrets and variables → Actions, crear:
#   CLOUDFLARE_API_TOKEN    token con permiso "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID   ID de la cuenta (visible en el panel de Cloudflare)
# Y en Cloudflare, crear un proyecto de Pages llamado `report-cali`.
#
# Alternativa sin secretos: conectar el repositorio desde el panel de Cloudflare
# Pages con estos ajustes, y borrar este archivo.
#   Build command:     npm run build
#   Build output:      apps/web/dist
#   Root directory:    /
#   NODE_VERSION:      22
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  desplegar:
    runs-on: ubuntu-latest
    # El secreto se expone como variable del trabajo para poder preguntar si existe.
    # Sin credenciales, el paso de publicación se salta en vez de fallar en rojo:
    # quien forkee el repositorio no debería encontrarse el CI roto por esto.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Publicar en Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler@latest pages deploy apps/web/dist --project-name=report-cali

      - name: Aviso si falta configurar credenciales
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::notice::El sitio se compiló pero no se publicó."
          echo "::notice::Configura CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID en Settings → Secrets → Actions."
