name: Desplegar

# Publica el sitio en Cloudflare Workers cuando cambia el código.
#
# El despliegue lo hace GitHub Actions, no la integración Git de Cloudflare. Así hay un
# solo sistema de CI que entender, y el Worker se crea solo en el primer despliegue: no
# hay que configurar nada en el panel de Cloudflare.
#
# ── Configuración necesaria una sola vez ────────────────────────────────────
# En Settings → Secrets and variables → Actions, crear:
#   CLOUDFLARE_API_TOKEN    token con permisos de edición de Workers y de R2
#   CLOUDFLARE_ACCOUNT_ID   ID de la cuenta (visible en el panel de Cloudflare)
#
# Paso a paso completo, con nombres exactos de botones: docs/TUTORIAL.md
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  desplegar:
    runs-on: ubuntu-latest
    # El secreto se expone como variable del trabajo para poder preguntar si existe.
    # Sin credenciales, el paso de publicación se salta en vez de fallar en rojo:
    # quien forkee el repositorio no debería encontrarse el CI roto por esto.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      # Diagnóstico antes de intentar publicar. `whoami` imprime a qué cuenta pertenece el
      # token y qué permisos tiene — nunca el token en sí. Cuando el despliegue falla, casi
      # siempre la causa está en esta salida, y sin ella hay que adivinar.
      - name: Verificar credenciales
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        continue-on-error: true
        run: |
          echo "Account ID configurado: ${CLOUDFLARE_ACCOUNT_ID:0:6}… (${#CLOUDFLARE_ACCOUNT_ID} caracteres)"
          npx --yes wrangler@latest whoami 2>&1 | tee whoami.txt || true

          # El error 10000 sobre /accounts/<id>/workers/... casi siempre significa una de
          # dos cosas: al token le faltan permisos, o el Account ID es de OTRA cuenta
          # distinta a la que el token puede tocar. Lo segundo es invisible a simple vista
          # —ambos valores «se ven bien»— así que lo comparamos aquí.
          ids=$(grep -oiE '\b[0-9a-f]{32}\b' whoami.txt | sort -u || true)

          if [ -z "$ids" ]; then
            echo "::warning::No se pudo leer la lista de cuentas del token."
          elif echo "$ids" | grep -qix "$CLOUDFLARE_ACCOUNT_ID"; then
            echo "✓ El Account ID coincide con una cuenta a la que el token tiene acceso."
          else
            echo "::error::EL ACCOUNT ID NO COINCIDE con ninguna cuenta del token."
            echo "  Configurado en el secreto : ${CLOUDFLARE_ACCOUNT_ID:0:8}…"
            echo "  El token puede acceder a  :"
            echo "$ids" | sed 's/^\(........\).*/    \1…/'
            echo "  Corrige CLOUDFLARE_ACCOUNT_ID con el valor que aparece arriba."
          fi

      - name: Publicar en Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        # La configuración vive en wrangler.jsonc, en la raíz del repositorio.
        run: |
          set +e
          npx --yes wrangler@latest deploy 2>&1 | tee salida.txt
          codigo=${PIPESTATUS[0]}
          set -e

          if [ "$codigo" -ne 0 ]; then
            echo "─────────────────────────────────────────────────────────"
            echo "El despliegue falló. Causas más frecuentes:"

            if grep -qi "subdomain" salida.txt; then
              echo "→ Falta registrar el subdominio workers.dev de la cuenta."
              echo "  En Cloudflare: Workers & Pages → Overview. La primera vez pide"
              echo "  elegir un subdominio; sin eso no se puede publicar desde CI."
            fi
            if grep -q "10502" salida.txt; then
              echo "→ Cloudflare bloqueó temporalmente los intentos de autenticación"
              echo "  ('Too many authentication failures', código 10502)."
              echo "  ESPERA entre 15 y 30 minutos antes de volver a intentar. Mientras"
              echo "  dure el bloqueo, hasta un token correcto va a fallar — así que"
              echo "  reintentar ahora solo alarga el bloqueo y confunde el diagnóstico."
            fi
            if grep -qiE "authentication|unauthorized|10000|permission|forbidden|denied" salida.txt; then
              echo "→ Al token le faltan permisos."
              echo "  Rehazlo con la PLANTILLA 'Edit Cloudflare Workers' (no a mano):"
              echo "  My Profile → API Tokens → Create Token → 'Edit Cloudflare Workers' → Use template."
              echo "  Armado a mano falla de forma confusa: whoami funciona pero deploy no."
              echo "  Detalle en el paso A2 de docs/TUTORIAL.md."
            fi
            if grep -qiE "account.*not found|invalid account" salida.txt; then
              echo "→ El CLOUDFLARE_ACCOUNT_ID no corresponde a la cuenta del token."
            fi

            echo "El texto exacto del error está arriba, en la salida de wrangler."
            echo "─────────────────────────────────────────────────────────"
            exit "$codigo"
          fi

      - name: Aviso si falta configurar credenciales
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::notice::El sitio se compiló pero no se publicó."
          echo "::notice::Configura CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID en Settings → Secrets → Actions."
